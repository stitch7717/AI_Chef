<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 私厨 · 交互原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --shell:#0f1626; --panel:#182136; --line:#263147; --ink:#e8eefb; --muted:#8fa0bd; --brand:#3d7fff; }
  body { font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--shell);
         color:var(--ink); height:100vh; display:flex; overflow:hidden; }

  /* 左侧导航 */
  aside { width:256px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .brand { padding:15px 18px 12px; border-bottom:1px solid var(--line); }
  .brand b { font-size:14px; }
  .brand small { display:block; color:var(--muted); font-size:10.5px; margin-top:3px; }
  .group { padding:12px 18px 5px; color:var(--muted); font-size:10px; letter-spacing:1px; }
  .nav { overflow-y:auto; padding-bottom:10px; }
  .nav button { display:flex; gap:9px; width:100%; text-align:left; background:none; border:none;
    color:var(--ink); font-size:12.5px; padding:8px 18px; cursor:pointer; border-left:2px solid transparent; font-family:inherit; }
  .nav button:hover { background:rgba(61,127,255,.08); }
  .nav button.on { background:rgba(61,127,255,.14); border-left-color:var(--brand); color:#fff; }
  .nav button i { color:var(--muted); font-style:normal; font-size:10.5px; min-width:16px; }
  .nav button.on i { color:var(--brand); }

  /* 舞台 */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { height:44px; flex-shrink:0; display:flex; align-items:center; gap:12px; padding:0 16px;
    border-bottom:1px solid var(--line); color:var(--muted); font-size:11.5px; }
  .topbar b { color:var(--ink); font-size:12.5px; }
  .topbar .sp { flex:1; }
  .topbar kbd { background:#22304a; border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:10.5px; color:var(--ink); }
  .zbtn { background:#22304a; border:1px solid var(--line); color:var(--muted); font-size:11px;
    padding:3px 9px; border-radius:5px; cursor:pointer; font-family:inherit; }
  .zbtn.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:22px; }
  .frame-wrap { transform-origin:center center; }
  .browser { border-radius:12px; overflow:hidden; background:#fff; box-shadow:0 24px 60px rgba(0,0,0,.55); border:1px solid #2a3a55; }
  .browser .bar { height:28px; background:#eef2f8; display:flex; align-items:center; gap:6px; padding:0 11px; border-bottom:1px solid #dde5f0; }
  .browser .dot { width:8px; height:8px; border-radius:50%; }
  .browser .addr { flex:1; height:15px; border-radius:8px; background:#fff; margin-left:7px; font-size:9px;
    color:#8798b3; display:flex; align-items:center; padding:0 8px; }
  .phone { border-radius:34px; overflow:hidden; position:relative; background:#fff;
    box-shadow:0 24px 60px rgba(0,0,0,.55); border:8px solid #0b1220; outline:1px solid #2c3a55; }

  /* 右侧说明 */
  .notes { width:244px; flex-shrink:0; border-left:1px solid var(--line); background:var(--panel); padding:16px; overflow-y:auto; }
  .notes h3 { font-size:12.5px; margin-bottom:10px; }
  .notes .row { margin-bottom:11px; }
  .notes .row span { display:block; color:var(--muted); font-size:10.5px; margin-bottom:3px; }
  .notes .row p { font-size:11.5px; line-height:1.7; color:#cfd9ec; }
  .notes ul { padding-left:15px; }
  .notes li { font-size:11.5px; line-height:1.75; color:#cfd9ec; }
  .notes .hint { margin-top:12px; font-size:10.5px; color:var(--muted); line-height:1.7;
    border-top:1px dashed var(--line); padding-top:10px; }

  /* 演示模式 */
  body.present aside, body.present .notes, body.present .topbar { display:none; }
  body.present .stage { padding:14px; background:#070d19; }
  .hud { position:fixed; left:50%; bottom:16px; transform:translateX(-50%) translateY(20px);
    display:flex; align-items:center; gap:7px; padding:6px 9px; background:rgba(16,24,40,.88);
    border:1px solid #2a3a55; border-radius:999px; backdrop-filter:blur(10px); opacity:0;
    pointer-events:none; transition:all .2s ease; z-index:99; }
  body.present .hud { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  .hbtn { width:26px; height:26px; border-radius:50%; border:1px solid #33456b; background:#1b2740;
    color:#dfe8fa; font-size:13px; cursor:pointer; display:grid; place-items:center; }
  .hbtn:hover { background:var(--brand); border-color:var(--brand); }
  .hbtn.exit:hover { background:#d9534f; border-color:#d9534f; }
  .hinfo { font-size:11px; color:#a9b8d3; padding:0 3px; }
  .hinfo b { color:#fff; }

  /* ============ 应用页面样式 ============ */
  .app { width:100%; height:100%; background:#eef4fb; color:#1b2b4a; font-size:13px; display:flex; overflow:hidden; position:relative; }
  .card { background:#fff; border-radius:18px; border:1px solid #e4ecf7; }
  .btn { border:none; border-radius:999px; padding:8px 18px; font-size:12.5px; cursor:pointer;
    background:#1b2b4a; color:#fff; font-family:inherit; font-weight:600; }
  .btn.sm { padding:5px 13px; font-size:11.5px; }
  .hs:hover { outline:2px dashed rgba(61,127,255,.75); outline-offset:2px; }
  body.show-zones [data-go] { outline:1.5px dashed rgba(61,127,255,.5); outline-offset:2px; }

  /* 侧栏 */
  .side { width:212px; flex-shrink:0; background:#fff; border-right:1px solid #e9f0f9; display:flex; flex-direction:column; padding:14px 10px; }
  .side .logo { display:flex; gap:9px; align-items:center; padding:2px 8px 15px; }
  .side .mark { width:34px; height:34px; border-radius:11px; background:#eef4ff; display:grid; place-items:center; font-size:17px; }
  .side .lname { font-size:13.5px; font-weight:700; }
  .side .lslogan { font-size:10px; color:#93a3bc; margin-top:1px; }
  .side .menu { display:flex; flex-direction:column; gap:2px; }
  .side .mi { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:10px; font-size:12.5px; color:#5a6b85; }
  .side .mi .ic { width:16px; text-align:center; }
  .side .mi.on { background:#eef4ff; color:#3d7fff; font-weight:600; }
  .side .foot { margin-top:auto; display:flex; align-items:center; gap:8px; padding:9px 8px 2px; }
  .side .ava { width:30px; height:30px; border-radius:50%; background:#1b2b4a; color:#fff; display:grid; place-items:center; font-size:12px; }
  .side .uname { font-size:12px; font-weight:600; }
  .side .usub { font-size:10px; color:#93a3bc; }

  /* 落地页 */
  .landing { width:100%; height:100%; position:relative; overflow:hidden; background:#0b1220; }
  .landing .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .landing .scrim { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(6,12,24,.74) 0%, rgba(6,12,24,.26) 34%, rgba(6,12,24,.88) 100%); }
  .landing nav { position:relative; z-index:2; display:flex; align-items:center; gap:18px; padding:15px 24px; color:#fff; font-size:12px; }
  .landing nav .logo { display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:700; }
  .landing nav a { color:#fff; text-decoration:none; text-shadow:0 1px 6px rgba(0,0,0,.5); opacity:.9; cursor:pointer; }
  .landing nav .sp { flex:1; }
  .landing .pill { background:#35c4b5; color:#06251f; font-weight:700; padding:6px 15px; border-radius:999px;
    box-shadow:0 6px 18px rgba(53,196,181,.35); cursor:pointer; }
  .landing .hero { position:relative; z-index:2; padding:22px 24px 0; color:#fff; height:calc(100% - 52px); display:flex; flex-direction:column; }
  .landing .kicker { align-self:flex-start; font-size:9.5px; letter-spacing:.9px; padding:3px 9px;
    border:1px solid rgba(255,255,255,.38); border-radius:999px; margin-bottom:11px; }
  .landing h1 { font-size:29px; line-height:1.42; font-weight:800; text-shadow:0 2px 20px rgba(0,0,0,.45); }
  .landing h1 em { font-style:normal; color:#7fe3d4; }
  .landing p.sub { margin-top:9px; font-size:12px; line-height:1.85; color:rgba(255,255,255,.84);
    max-width:36em; text-shadow:0 1px 8px rgba(0,0,0,.5); }
  .landing .cta { display:flex; gap:10px; margin-top:16px; }
  .landing .btn-main { background:#35c4b5; color:#06251f; font-weight:700; font-size:12.5px; padding:10px 20px;
    border:none; border-radius:10px; cursor:pointer; font-family:inherit; }
  .landing .btn-ghost { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.45); color:#fff;
    font-size:12.5px; padding:10px 18px; border-radius:10px; cursor:pointer; backdrop-filter:blur(6px); font-family:inherit; }
  .landing .cards { margin-top:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding-bottom:18px; }
  .landing .c { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); border-radius:12px;
    padding:11px 13px; backdrop-filter:blur(8px); }
  .landing .c b { font-size:12px; display:block; margin-bottom:3px; }
  .landing .c small { font-size:10.5px; color:rgba(255,255,255,.72); line-height:1.6; }

  /* 登录 */
  .login { width:100%; height:100%; display:grid; place-items:center;
    background:radial-gradient(1000px 600px at 20% 0%, #e6f0ff 0%, #eef4fb 45%, #e9f2fb 100%); }
  .login .box { width:372px; }
  .login .logo-row { display:flex; gap:10px; align-items:center; justify-content:center; margin-bottom:15px; }
  .login .mark { width:44px; height:44px; border-radius:14px; background:#1b2b4a; display:grid; place-items:center; font-size:21px; }
  .login .title { font-size:21px; font-weight:800; letter-spacing:.5px; }
  .login .sl { font-size:11px; color:#93a3bc; margin-top:3px; }
  .login .panel { padding:20px 22px 22px; border-radius:20px; }
  .login .tabs { display:flex; gap:18px; border-bottom:1px solid #eef2f8; margin-bottom:16px; }
  .login .tab { padding:0 0 9px; font-size:13px; color:#93a3bc; cursor:pointer; font-weight:600; }
  .login .tab.on { color:#1b2b4a; box-shadow:inset 0 -2px 0 #3d7fff; }
  .login .field { margin-bottom:12px; }
  .login .field label { display:block; font-size:11px; color:#5a6b85; margin-bottom:5px; }
  .login .inp { height:38px; border-radius:10px; border:1px solid #e2eaf6; background:#f7faff;
    display:flex; align-items:center; padding:0 12px; font-size:12.5px; color:#93a3bc; }
  .login .inp.solid { color:#1b2b4a; }
  .login .submit { width:100%; height:40px; border-radius:10px; background:#1b2b4a; color:#fff; border:none;
    font-size:13px; font-weight:600; cursor:pointer; margin-top:4px; font-family:inherit; }
  .login .tip { text-align:center; font-size:10.5px; color:#93a3bc; margin-top:12px; line-height:1.7; }
  .login .reg { display:none; }
  .login.reg-mode .login-form { display:none; }
  .login.reg-mode .reg { display:block; }

  /* 对话 */
  .chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat .msgs { flex:1; padding:18px 22px; display:flex; flex-direction:column; gap:14px; overflow:hidden; }
  .msg { display:flex; gap:9px; }
  .msg .av { width:28px; height:28px; border-radius:50%; background:#eef4ff; display:grid; place-items:center; font-size:14px; flex-shrink:0; }
  .msg .bd { max-width:648px; }
  .bubble { background:#fff; border:1px solid #e9f0f9; border-radius:14px; padding:12px 15px; font-size:12.5px; line-height:1.8; }
  .msg.me { justify-content:flex-end; }
  .msg.me .bd { max-width:420px; }
  .msg.me .bubble { background:#1b2b4a; color:#fff; border:none; }
  .msg .h { font-size:14px; font-weight:700; margin:8px 0 5px; }
  .msg .h:first-child { margin-top:0; }
  .msg ul, .msg ol { padding-left:19px; margin:4px 0 6px; }
  .msg li { margin-bottom:2px; }
  .msg .kv { color:#5a6b85; }
  .chat .input { padding:0 18px 16px; }
  .chat .ibox { display:flex; align-items:flex-end; gap:9px; background:#fff; border:1px solid #e4ecf7;
    border-radius:16px; padding:9px 10px; box-shadow:0 4px 16px rgba(27,43,74,.05); }
  .chat .icon-btn { width:32px; height:32px; border-radius:10px; border:1px solid #e4ecf7; background:#f7faff;
    display:grid; place-items:center; font-size:14px; cursor:pointer; }
  .chat .ph { flex:1; font-size:12.5px; color:#93a3bc; padding:6px 2px; }
  .chat .send { width:32px; height:32px; border-radius:10px; background:#1b2b4a; color:#fff; display:grid; place-items:center; font-size:14px; cursor:pointer; }
  .chat .hint { text-align:center; font-size:10px; color:#b3c0d4; margin-top:7px; }

  /* 库存 */
  .pantry { flex:1; padding:20px 26px; overflow:hidden; }
  .ov { padding:16px 18px; margin-bottom:14px; }
  .ov .num { font-size:32px; font-weight:800; line-height:1.1; }
  .ov .num span { font-size:13px; font-weight:600; color:#5a6b85; }
  .ov .lb { font-size:11.5px; color:#93a3bc; margin-top:5px; }
  .ov .metrics { display:flex; gap:24px; margin-top:13px; }
  .ov .m { display:flex; align-items:center; gap:7px; font-size:11px; }
  .ov .ring { width:12px; height:12px; border-radius:50%; border:3px solid currentColor; }
  .ov .tip2 { margin-top:13px; padding:9px 12px; background:#eef4ff; border-radius:10px; font-size:11.5px; color:#5a6b85; line-height:1.6; }
  .phead { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px; }
  .phead h2 { font-size:17px; font-weight:800; }
  .phead p { font-size:11.5px; color:#93a3bc; margin-top:3px; }
  .phead .acts { display:flex; align-items:center; gap:12px; }
  .switch { display:flex; align-items:center; gap:6px; font-size:11.5px; color:#5a6b85; }
  .sw { width:30px; height:16px; border-radius:999px; background:#dfe7f3; position:relative; }
  .sw::after { content:""; position:absolute; width:12px; height:12px; border-radius:50%; background:#fff; top:2px; left:2px; }
  .rows { display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:11px; padding:9px 13px; border-radius:14px; background:#fff; border:1px solid #e9f0f9; }
  .row .thumb { width:42px; height:42px; border-radius:11px; overflow:hidden; background:#f2f6fb; flex-shrink:0; }
  .row .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .row .nm { font-size:13px; font-weight:700; }
  .row .qty { font-size:11px; color:#93a3bc; margin-top:2px; }
  .row .qty em { font-style:normal; color:#2fb37a; font-weight:600; margin-left:4px; }
  .row .pillst { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600;
    color:#2fb37a; background:#eafaf3; padding:3px 9px; border-radius:999px; margin-left:auto; }
  .row .pillst i { width:5px; height:5px; border-radius:50%; background:currentColor; }
  .row .ops { display:flex; gap:8px; color:#93a3bc; font-size:13px; }

  /* 弹窗 */
  .mask { position:absolute; inset:0; background:rgba(20,32,54,.42); display:grid; place-items:center; backdrop-filter:blur(2px); z-index:20; }
  .modal { width:424px; background:#fff; border-radius:18px; padding:18px 20px 20px; box-shadow:0 20px 50px rgba(15,26,45,.28); }
  .modal h3 { font-size:15px; margin-bottom:12px; }
  .modal .preview { display:flex; gap:11px; align-items:center; background:#f5f9ff; border-radius:12px; padding:10px 12px; margin-bottom:13px; }
  .modal .preview img { width:52px; height:52px; border-radius:11px; object-fit:cover; }
  .modal .preview b { font-size:13.5px; display:block; }
  .modal .preview small { display:block; font-size:10.5px; color:#5a6b85; line-height:1.6; }
  .modal .f { margin-bottom:11px; }
  .modal .f label { display:block; font-size:11px; color:#5a6b85; margin-bottom:5px; }
  .modal .inp { height:36px; border-radius:9px; border:1px solid #e2eaf6; background:#f7faff;
    display:flex; align-items:center; padding:0 11px; font-size:12.5px; color:#1b2b4a; }
  .modal .caret { width:1px; height:14px; background:#3d7fff; margin-left:1px; }
  .modal .sug { margin-top:4px; background:#fff; border:1px solid #e4ecf7; border-radius:10px;
    box-shadow:0 10px 26px rgba(27,43,74,.12); overflow:hidden; }
  .modal .sug .it { display:flex; gap:9px; align-items:center; padding:7px 10px; font-size:12px; }
  .modal .sug .it img { width:26px; height:26px; border-radius:7px; object-fit:cover; }
  .modal .sug .it.on { background:#eef4ff; }
  .modal .sug .it small { color:#93a3bc; font-size:10px; }
  .modal .foot { display:flex; justify-content:flex-end; gap:9px; }
  .modal .btn2 { border-radius:999px; padding:7px 17px; font-size:12.5px; cursor:pointer; font-family:inherit;
    border:1px solid #dbe4f0; background:#fff; color:#1b2b4a; }
  .modal .btn2.pri { background:#1b2b4a; color:#fff; border-color:#1b2b4a; font-weight:600; }

  /* 发现 */
  .disc { flex:1; padding:18px 26px; overflow:hidden; }
  .masthead { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:12px; }
  .masthead .eyebrow { font-size:10px; letter-spacing:1.6px; color:#3d7fff; font-weight:700; }
  .masthead h1 { font-size:26px; font-weight:800; letter-spacing:.5px; margin-top:3px; }
  .masthead p { font-size:11.5px; color:#93a3bc; margin-top:4px; }
  .search { display:flex; gap:8px; }
  .search .inp { width:190px; height:32px; border-radius:999px; border:1px solid #e4ecf7; background:#fff;
    display:flex; align-items:center; padding:0 12px; font-size:11.5px; color:#93a3bc; }
  .chips { display:flex; gap:7px; margin-bottom:12px; }
  .chip { font-size:11px; padding:4px 11px; border-radius:999px; background:#fff; border:1px solid #e4ecf7; color:#5a6b85; cursor:pointer; }
  .chip.on { background:#1b2b4a; color:#fff; border-color:#1b2b4a; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .dish { background:#fff; border:1px solid #e9f0f9; border-radius:16px; overflow:hidden; }
  .dish .cover { position:relative; height:128px; background:#f2f6fb; }
  .dish .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .dish .badge { position:absolute; top:8px; left:8px; font-size:10px; padding:2px 8px; border-radius:999px;
    background:rgba(255,255,255,.88); backdrop-filter:blur(4px); color:#1b2b4a; font-weight:600; }
  .dish .fav { position:absolute; top:7px; right:7px; width:22px; height:22px; border-radius:50%;
    background:rgba(255,255,255,.88); display:grid; place-items:center; font-size:11px; }
  .dish .bd { padding:9px 11px 11px; }
  .dish h4 { font-size:13px; font-weight:700; }
  .dish .meta { font-size:10.5px; color:#93a3bc; margin-top:3px; }
  .dish .tags { display:flex; gap:4px; margin-top:7px; flex-wrap:wrap; }
  .dish .tags span { font-size:9.5px; background:#f2f6fb; color:#5a6b85; padding:1px 7px; border-radius:999px; }

  /* 移动端覆盖 */
  .m .side { display:none; }
  .m .tabbar { position:absolute; left:0; right:0; bottom:0; height:54px; background:#fff; border-top:1px solid #e9f0f9;
    display:flex; align-items:center; }
  .m .tabbar .t { flex:1; text-align:center; font-size:10px; color:#93a3bc; display:flex; flex-direction:column; gap:2px; align-items:center; }
  .m .tabbar .t b { font-size:15px; line-height:1; font-weight:400; }
  .m .tabbar .t.on { color:#1b2b4a; font-weight:700; }
  .m .mbar { display:flex; align-items:center; gap:8px; padding:9px 12px; background:#fff; border-bottom:1px solid #eef2f8; }
  .m .mbar .b { width:30px; height:30px; border-radius:9px; border:1px solid #e4ecf7; display:grid; place-items:center; font-size:13px; }
  .m .mbar .t2 { flex:1; text-align:center; font-size:12.5px; font-weight:600; }
  .m .chat .msgs { padding:12px; gap:10px; }
  .m .chat .bd { max-width:80%; }
  .m .chat .input { padding:0 10px 62px; }
  .m .pantry { padding:12px 12px 62px; }
  .m .ov { padding:12px 14px; margin-bottom:10px; }
  .m .ov .num { font-size:26px; }
  .m .phead { margin-bottom:9px; }
  .m .phead h2 { font-size:15px; }
  .m .row { padding:7px 10px; }
  .m .disc { padding:12px 12px 62px; }
  .m .masthead h1 { font-size:19px; }
  .m .search .inp { width:128px; height:28px; font-size:10.5px; }
  .m .grid3 { grid-template-columns:repeat(2,1fr); gap:8px; }

const DESKTOP = { w: 1440, h: 900 };
const MOBILE = { w: 390, h: 844 };
let idx = 0, zoomMode = "fit";

const stage = document.getElementById("stage");
const navEl = document.getElementById("nav");
const notesEl = document.getElementById("notes");
const crumb = document.getElementById("crumb");
const devTag = document.getElementById("devTag");

function buildNav() {
  let html = "", last = "";
  SCREENS.forEach((s, i) => {
    if (s.group !== last) { html += `<div class="group">${s.group}</div>`; last = s.group; }
    html += `<button data-i="${i}"><i>${String(i + 1).padStart(2, "0")}</i>${s.name}</button>`;
  });
  navEl.innerHTML = html;
  navEl.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => go(+b.dataset.i)));
}

function go(i) {
  idx = Math.max(0, Math.min(SCREENS.length - 1, i));
  const s = SCREENS[idx];
  const size = s.device === "mobile" ? MOBILE : DESKTOP;
  const inPresent = document.body.classList.contains("present");
  const pad = 44, chromeH = s.device === "mobile" ? 16 : 28;
  const availW = stage.clientWidth - pad;
  const availH = stage.clientHeight - pad - (inPresent ? 58 : 0) - chromeH;
  const scale = zoomMode === "real" ? 1 : Math.min(availW / size.w, availH / size.h, 1);

  const inner = `<div style="width:${size.w}px;height:${size.h}px;overflow:hidden;position:relative">${s.build()}</div>`;

  stage.innerHTML = s.device === "mobile"
    ? `<div class="frame-wrap" style="width:${size.w * scale}px;height:${size.h * scale}px">
         <div class="phone" style="width:${size.w}px;height:${size.h}px;transform:scale(${scale});transform-origin:top left">${inner}</div>
       </div>`
    : `<div class="frame-wrap" style="width:${size.w * scale}px;height:${(size.h + chromeH) * scale}px">
         <div class="browser" style="width:${size.w}px;height:${size.h + chromeH}px;transform:scale(${scale});transform-origin:top left">
           <div class="bar">
             <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
             <span class="addr">localhost:8080/${s.id === "landing" ? "" : s.id.replace("m-", "")}</span>
           </div>
           <div style="position:relative;width:${size.w}px;height:${size.h}px;background:#fff">${inner}</div>
         </div>
       </div>`;

  // 登录页 Tab 切换
  const tl = stage.querySelector("#tabLogin"), tr = stage.querySelector("#tabReg");
  if (tl && tr) {
    const scr = stage.querySelector("#loginScreen");
    tl.onclick = () => { scr.classList.remove("reg-mode"); tl.classList.add("on"); tr.classList.remove("on"); };
    tr.onclick = () => { scr.classList.add("reg-mode"); tr.classList.add("on"); tl.classList.remove("on"); };
  }

  navEl.querySelectorAll("button").forEach((b, k) => b.classList.toggle("on", k === idx));
  crumb.textContent = s.name;
  devTag.textContent = s.device === "mobile" ? "390 × 844" : "1440 × 900";
  document.getElementById("hIdx").textContent = idx + 1;
  document.getElementById("hTotal").textContent = SCREENS.length;
  document.getElementById("hName").textContent = s.name;
  notesEl.innerHTML = `
    <h3>${s.name}</h3>
    <div class="row"><span>这个页面解决什么</span><p>${s.goal}</p></div>
    <div class="row"><span>设计要点</span><ul>${s.points.map((p) => `<li>${p}</li>`).join("")}</ul></div>
    <div class="hint">页面为真 HTML（非截图），按钮可直接点；<b>←</b> <b>→</b> 翻页，<b>H</b> 显示可点区域。</div>`;
}

/* 点击跳转 */
stage.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go]");
  if (!el) return;
  const to = SCREENS.findIndex((x) => x.id === el.dataset.go);
  if (to >= 0) go(to);
});

/* 缩放 + 演示 */
const zFit = document.getElementById("zFit"), zReal = document.getElementById("zReal");
function setZoom(mode) {
  zoomMode = mode;
  zFit.classList.toggle("on", mode === "fit");
  zReal.classList.toggle("on", mode === "real");
  go(idx);
}
zFit.onclick = () => setZoom("fit");
zReal.onclick = () => setZoom("real");

function setPresent(on) {
  document.body.classList.toggle("present", on);
  document.getElementById("presentBtn").textContent = on ? "退出演示" : "▶ 演示模式";
  requestAnimationFrame(() => go(idx));
}
document.getElementById("presentBtn").onclick = () => setPresent(!document.body.classList.contains("present"));
document.getElementById("hPrev").onclick = () => go(idx - 1);
document.getElementById("hNext").onclick = () => go(idx + 1);
document.getElementById("hExit").onclick = () => setPresent(false);

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(idx + 1);
  else if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("show-zones");
  else if (e.key === "p" || e.key === "P") setPresent(!document.body.classList.contains("present"));
  else if (e.key === "Escape") setPresent(false);
});
window.addEventListener("resize", () => go(idx));

buildNav();
go(0);
</script>
</body>
</html>
