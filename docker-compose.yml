services:
  postgres:
    # pgvector 镜像 = PostgreSQL 16 + 向量扩展（RAG 菜谱检索用）
    image: pgvector/pgvector:pg16
    container_name: lcp-postgres
    environment:
      POSTGRES_USER: lc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: lc_course
      TZ: Asia/Shanghai
    ports:
      # 5433 避免与本机其他 PG 冲突；只绑定本机
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc -d lc_course"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: lcp-redis
    ports:
      # 6380 避免与本机其他 Redis（如 hospital 项目的 6379）冲突
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: lcp-api
    env_file: .env
    environment:
      # 容器网络内数据库主机是 postgres（覆盖 .env 里的 localhost）
      DATABASE_URL: postgresql+asyncpg://lc:${POSTGRES_PASSWORD}@postgres:5432/lc_course
      DATABASE_URL_SYNC: postgresql+psycopg://lc:${POSTGRES_PASSWORD}@postgres:5432/lc_course
      REDIS_URL: redis://redis:6379/0
      HF_ENDPOINT: https://hf-mirror.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 8003 直连调试用（网页走 8080 由 Nginx 反代，不占 8002 避免与本地开发服务冲突）
      - "127.0.0.1:8003:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  web:
    build: ./frontend
    container_name: lcp-web
    depends_on:
      - api
    ports:
      # 浏览器入口：http://127.0.0.1:8080
      - "127.0.0.1:8080:80"

volumes:
  pg-data:
  redis-data:
