# Nginx 配置：静态资源 + API 反向代理（含 SSE 流式支持）
server {
    listen 80;
    client_max_body_size 20m;

    # 文本资源 gzip（JS/CSS/JSON 体积可减 70%）
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml;

    # 图片：内容不变，长期缓存
    location /recipe-images/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location /ingredient-images/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 构建产物带 hash，长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API 反代到后端容器
    location /api/ {
        proxy_pass http://api:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # uvicorn --proxy-headers 依赖此头还原客户端真实 IP（限流按真实 IP 才公平）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 必需：关闭缓冲，否则流式输出会被攒成一坨
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 前端路由 history 模式：刷新不 404
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
